name: buddybuild
description: buddybuild was a mobile continuous integration and continuous delivery (CI/CD) platform for
  iOS and Android apps, offering automated builds, testing, user feedback, and over-the-air deployment
  to testers. Backed by Bloomberg Beta and Kleiner Perkins, it was acquired by Apple in January 2018;
  the standalone service was wound down through 2018-2019 and its capabilities were folded into Apple's
  Xcode Cloud. The buddybuild.com domain now redirects to developer.apple.com/xcode-cloud/, and no
  independent developer portal, API, SDK, or documentation surface remains. Retained as a network record
  of an acquired/defunct provider rather than an active enrichment target.
